name: MenInBlueLive
options:
  bundleIdPrefix: com.rishabmadan
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.2"
targets:
  MenInBlueLive:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources: 
      - iOS/MenInBlueLive
    info:
      path: iOS/MenInBlueLive/Info.plist
    dependencies:
      - target: MenInBlueLiveWidget
  MenInBlueLiveWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources: 
      - iOS/MenInBlueLiveWidget
      - iOS/MenInBlueLive/LiveScoreManager.swift
    info:
      path: iOS/MenInBlueLive/Info.plist
