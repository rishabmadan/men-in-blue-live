name: MenInBlueLive
options:
  bundleIdPrefix: com.rishabmadan
  xcodeVersion: "15.4"
  deploymentTarget:
    iOS: "16.2"
targets:
  MenInBlueLive:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources: 
      - iOS/MenInBlueLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: iOS/MenInBlueLive/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rishabmadan.MenInBlueLive
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: iOS/MenInBlueLive/Info.plist
      properties:
        NSSupportsLiveActivities: true
    dependencies:
      - target: MenInBlueLiveWidget
  MenInBlueLiveWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources: 
      - iOS/MenInBlueLiveWidget
      - iOS/MenInBlueLive/CricketMatchAttributes.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: iOS/MenInBlueLiveWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rishabmadan.MenInBlueLive.widget
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: iOS/MenInBlueLiveWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
