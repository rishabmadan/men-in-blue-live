name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare and sanitize Android build files
        run: |
          mkdir -p android/app
          cd android

          # Trim any accidental mobile trailing spaces from filenames
          for f in *; do
            [ -e "$f" ] || continue
            clean=$(echo "$f" | sed 's/[[:space:]]*$//')
            if [ "$f" != "$clean" ]; then
              mv "$f" "$clean"
            fi
          done

          # Guarantee clean settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MenInBlueLive"
          include(":app")
          EOF

          # Guarantee clean root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          echo "=== Verified Android Directory ==="
          ls -la
          cd ..

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenInBlueLive-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
