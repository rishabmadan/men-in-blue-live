name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project MenInBlueLive.xcodeproj \
                     -scheme MenInBlueLive \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/MenInBlueLive.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/MenInBlueLive.xcarchive/Products/Applications/MenInBlueLive.app Payload/
          zip -r MenInBlueLive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenInBlueLive-App
          path: MenInBlueLive.ipa
